<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dish Cost Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface2:#E8EEE7; --ink:#16211B; --muted:#5B6A61; --line:#D3DCD4;
  --accent:#0E6A4E; --accent-ink:#FFFFFF; --accent-soft:#DCEBE4; --saffron:#9A6200; --saffron-soft:#FBF0D3;
  --good:#0ca30c; --warn:#fab219; --bad:#d03b3b; --input:#FFFBE8; --input-line:#E2CF86; --shadow:0 12px 40px rgba(16,33,25,.18);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101714; --surface:#18211D; --surface2:#212C27; --ink:#E4EBE6; --muted:#93A299; --line:#2D3A34;
    --accent:#5BC59C; --accent-ink:#0B1511; --accent-soft:#1D3A2F; --saffron:#E3AE45; --saffron-soft:#33290F;
    --input:#2A291A; --input-line:#5E5526; --shadow:0 12px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#101714; --surface:#18211D; --surface2:#212C27; --ink:#E4EBE6; --muted:#93A299; --line:#2D3A34;
  --accent:#5BC59C; --accent-ink:#0B1511; --accent-soft:#1D3A2F; --saffron:#E3AE45; --saffron-soft:#33290F;
  --input:#2A291A; --input-line:#5E5526; --shadow:0 12px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.batchsel{display:flex;gap:2px;align-items:center;margin-left:auto;border:1px solid var(--line);border-radius:8px;padding:3px 3px 3px 10px;background:var(--surface)}
.batchsel span{font-size:12px;color:var(--muted);margin-right:6px;text-transform:uppercase;letter-spacing:.06em}
.batchsel button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-weight:500}
.batchsel button[aria-pressed="true"]{background:var(--saffron);color:#fff}
.batchsel button:hover{background:var(--surface2)} .batchsel button[aria-pressed="true"]:hover{background:var(--saffron)}
@media (max-width:900px){.batchsel{margin-left:0}}
.tab{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.tab:hover{color:var(--ink);background:var(--surface2)}
.tab[aria-selected="true"]{color:var(--accent-ink);background:var(--accent)}
.banner{background:var(--saffron-soft);color:var(--ink);border-bottom:1px solid var(--line);font-size:13px}
.banner .wrap{padding-block:8px}

main.wrap{padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-family:var(--display);font-weight:500;font-size:16px;margin:0}
.lede{color:var(--muted);max-width:68ch;margin:4px 0 0}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.kpi b{font-family:var(--mono);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search],.toolbar select,.field input,.field select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:36px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
.toolbar select{flex:0 1 auto;max-width:100%}
.check{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px}
.chip button{border:0;background:none;cursor:pointer;border-radius:50%;width:22px;height:22px;line-height:1}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 14px;min-height:36px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.btn{display:inline-flex;align-items:center;cursor:pointer} .btn.disabled{opacity:.5;cursor:progress}
.link{background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left;font-weight:500;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--accent);color:var(--accent)}

/* tables */
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
th.num{text-align:right}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface2)}
td .sub{font-size:12px;color:var(--muted);margin-top:1px}
.thumb{width:52px;height:52px;min-width:52px;max-width:none;max-height:none;border-radius:9px;object-fit:cover;background:var(--surface2);display:block;flex:none}
.thumb.ph{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);border:1px dashed var(--line);box-sizing:border-box}
td.thumbcell{width:64px;min-width:64px;padding-right:0}
td.thumbcell button{display:block;width:52px;height:52px;padding:0;margin:0;border:0;background:none;cursor:pointer;line-height:0}
.dishrow{display:flex;gap:10px;align-items:flex-start}
.hero{width:100%;border-radius:12px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.hero .pic{position:relative;width:100%;aspect-ratio:16/9;max-height:320px;background:var(--surface2);overflow:hidden}
.hero .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--muted);font-size:14px}
@supports not (aspect-ratio:16/9){.hero .pic{height:240px}}
.hero .tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:var(--surface);border-top:1px solid var(--line)}
.hero .tools .tag{align-self:center}
@media (max-width:900px){td.thumbcell{width:50px;min-width:50px;padding-left:6px} .thumb{width:40px;height:40px;min-width:40px;border-radius:7px} td.thumbcell button{width:40px;height:40px} .thumb.ph{font-size:14px}}
tr.subrec td:first-child{box-shadow:inset 3px 0 0 var(--accent-soft)}
input.cell{width:84px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;background:var(--input);border:1px solid var(--input-line);border-radius:5px;padding:5px 8px}
input.cell.plain{background:var(--surface);border-color:var(--line)}
input.cell.set{background:var(--surface);border-color:var(--ink);font-weight:700}
input.cell:disabled{opacity:.6}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.pill small{font-family:var(--body);color:var(--muted);font-size:11px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.tag.attn{border-color:var(--saffron);color:var(--saffron)}
.tag a{color:inherit;text-decoration:underline} .hero .tools .tag{white-space:normal}
.bar{height:8px;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px}
.barcell{min-width:120px}
.up{color:var(--bad)} .down{color:var(--good)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:31;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;gap:12px;align-items:flex-start;padding:16px;border-bottom:1px solid var(--line)}
.drawer header div{flex:1;min-width:0}
.drawer .body{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.drawer .body>*{flex:none}
.nowrap{white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:10px 12px;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.stat span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.stat b{font-family:var(--mono);font-weight:500;font-size:16px}
.stat.hero{background:var(--accent-soft)}
.needs{font-family:var(--body);font-weight:400;font-size:12px;color:var(--saffron)}
tr.total td{border-top:2px solid var(--line);background:var(--surface2)}
td.dishcell{min-width:200px}
@media (max-width:900px){td.dishcell{min-width:150px}}
tbody tr.total:hover td{background:var(--surface2)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.field input{font-family:var(--mono);width:100%}
.field input.sell{background:var(--input);border-color:var(--input-line)}
.field small{color:var(--muted);font-size:11px}
.flags{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.flags li{background:var(--saffron-soft);border-radius:6px;padding:8px 10px;font-size:13px}
.note{font-size:12px;color:var(--muted)}
.note.warn{color:var(--saffron)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.steps{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.steps b{color:var(--ink)}
textarea{width:100%;min-height:110px;font-family:var(--mono);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;max-width:90%;box-shadow:var(--shadow)}
@media (max-width:1240px){.hide-md{display:none} td,th{padding:9px 9px} td.dishcell{min-width:200px} input.cell{width:84px}}
@media (max-width:900px){.hide-sm{display:none} input.cell{width:78px} td,th{padding:8px 8px} td.dishcell{min-width:150px} .tabs{margin-left:0}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}

<header class="top"><div class="wrap">
  <h1 class="brand">Dish Cost Book<small id="brandsub">Loading costing data</small></h1>
  <div class="batchsel" id="batchsel" role="group" aria-label="Batch size"></div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-tab="dishes" aria-selected="true">Dishes</button>
    <button class="tab" role="tab" data-tab="compare" aria-selected="false">Compare</button>
    <button class="tab" role="tab" data-tab="prices" aria-selected="false">Prices</button>
    <button class="tab" role="tab" data-tab="update" aria-selected="false">Update prices</button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false">Settings</button>
  </nav>
</div></header>
<div class="banner" id="banner" hidden><div class="wrap" id="bannertext"></div></div>
<main class="wrap" id="view"><div class="empty">Loading dishes and prices</div></main>
<div id="drawerhost"></div>
<div id="toasthost" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* Costing engine: pure functions, no DOM. Same maths as the verified spreadsheet. */
function normName(s) {
  return String(s == null ? "" : s).replace(/ /g, " ").replace(/\s+/g, " ").trim().toLowerCase();
}

/* How many price-units one recipe-unit is worth. Never guesses a density. */
function lineFactor(lineUnit, price, settings) {
  var pu = price.unit;
  if (lineUnit === pu) return { f: 1, mismatch: false, how: "" };
  if (lineUnit === "g" && pu === "pc") {
    return { f: 1 / settings.eggG, mismatch: false, how: "g to pieces at " + settings.eggG + " g each" };
  }
  if (lineUnit === "pc" && pu === "g") {
    return { f: settings.eggG, mismatch: false, how: "pieces to g at " + settings.eggG + " g each" };
  }
  var d = price.density;
  if (d && lineUnit === "g" && pu === "ml") return { f: 1 / d, mismatch: false, how: "g to ml at " + d + " g/ml" };
  if (d && lineUnit === "ml" && pu === "g") return { f: d, mismatch: false, how: "ml to g at " + d + " g/ml" };
  return { f: 1, mismatch: true, how: "recipe in " + lineUnit + ", price per " + pu + ", no density on file: treated 1:1" };
}

/* prices: {pid: {name, unit, price, density?}}, dishes: {id: dishDoc}, settings: {...} */
function costAll(prices, dishes, settings) {
  var memo = {};
  function cost(id, stack) {
    if (memo[id]) return memo[id];
    var d = dishes[id];
    if (!d) return null;
    stack = stack || [];
    if (stack.indexOf(id) >= 0) return null; // circular sub-recipe
    var ing = 0, rawYield = 0, missing = [], mismatch = 0, lines = [];
    (d.lines || []).forEach(function (l) {
      var q = Number(l.q) || 0, unitPrice = null, f = 1, how = "", c = null, priceUnit = "g", label = "";
      rawYield += q;
      if (l.sub) {
        var s = cost(l.sub, stack.concat([id]));
        if (s && s.perG != null) { unitPrice = s.perG; label = dishes[l.sub].name; if (s.missing.length) missing.push(l.n + " (sub-recipe incomplete)"); }
        else missing.push(l.n);
      } else {
        var p = prices[l.p];
        if (p && typeof p.price === "number") {
          var ff = lineFactor(l.u, p, settings);
          f = ff.f; how = ff.how; if (ff.mismatch) mismatch++;
          unitPrice = p.price; priceUnit = p.unit; label = p.name;
        } else missing.push(l.n);
      }
      if (unitPrice != null) { c = q * f * unitPrice; ing += c; }
      lines.push({ cost: c, unitPrice: unitPrice, priceUnit: priceUnit, factor: f, how: how, label: label });
    });
    var yieldG = Number(d.yieldOverride) > 0 ? Number(d.yieldOverride) : rawYield;
    var portion = Number(d.portion) > 0 ? Number(d.portion) : null;
    var perG = yieldG > 0 ? ing / yieldG : null;
    var perPortion = perG != null && portion ? perG * portion : null;
    /* Served-with add-ons, costed per portion (not part of the batch). Rice is stored as cooked grams and
       converted to raw at settings.riceRatio (Master note: 1 g raw = 3 g cooked). */
    var sides = d.sides;
    if (!sides && d.rice) sides = [{ kind: "rice", p: d.rice, cooked: (settings.riceG || 20) * (settings.riceRatio || 3) }];
    var rice = 0, addons = 0, sideOut = [];
    (sides || []).forEach(function (s) {
      var q, up = null, lab = s.label || "", su = s.u || "g", how = "";
      if (s.kind === "rice") { q = (Number(s.cooked) || 0) / (settings.riceRatio || 3); var rp = prices[s.p]; if (rp) { up = rp.price; lab = rp.name; } else missing.push("rice"); }
      else if (s.sub) { var ss = cost(s.sub, stack.concat([id])); q = Number(s.q) || 0; if (ss && ss.perG != null) { up = ss.perG; lab = lab || dishes[s.sub].name; } else missing.push(lab || s.sub); }
      else { var sp = prices[s.p]; q = Number(s.q) || 0; if (sp) { var sf = lineFactor(su, sp, settings); up = sp.price * sf.f; how = sf.how; lab = lab || sp.name; if (sf.mismatch) mismatch++; } else missing.push(lab || "add-on"); }
      var sc = up != null ? q * up : null;
      if (sc != null) { if (s.kind === "rice") rice += sc; else addons += sc; }
      sideOut.push({ kind: s.kind || "addon", label: lab, q: q, u: s.kind === "rice" ? "g raw" : su, cooked: s.cooked, cost: sc, how: how });
    });
    var total = perPortion != null ? perPortion + rice + addons : null;
    /* Waste/spoilage and overhead: applied one after the other on the ingredient cost (settings), else the dish's own loading. */
    var wasteP = typeof settings.wastePct === "number" ? settings.wastePct : null, ohP = typeof settings.overheadPct === "number" ? settings.overheadPct : null;
    var loading = wasteP != null && ohP != null ? (1 + wasteP) * (1 + ohP) - 1 : (typeof d.loading === "number" ? d.loading : 0.6);
    var waste = total != null && wasteP != null ? total * wasteP : null;
    var overhead = total != null && wasteP != null && ohP != null ? (total + waste) * ohP : null;
    var loaded = total != null ? total * (1 + loading) : null;
    var tFc = settings.targetFc || 0.15, rnd = settings.priceRound || 1;
    var suggested = loaded != null && tFc > 0 ? Math.ceil(loaded / tFc / rnd) * rnd : null;
    /* Selling price: the dish's own price when one is typed, otherwise the suggested price (so food cost % always reads). */
    var sellSet = Number(d.sell) > 0 ? Number(d.sell) : null;
    var sell = sellSet != null ? sellSet : suggested;
    var net = sell ? (settings.vatIncluded ? sell / (1 + settings.vatRate) : sell) : null;
    var r = {
      id: id, ing: ing, rawYield: rawYield, yieldG: yieldG, portion: portion,
      portions: portion && yieldG ? yieldG / portion : null,
      perG: perG, perPortion: perPortion, rice: rice, addons: addons, sides: sideOut, total: total, loaded: loaded, waste: waste, overhead: overhead, loading: loading, suggested: suggested,
      sell: sell, sellSet: sellSet, sellDefault: sellSet == null, net: net,
      fc: net && total != null ? total / net : null,
      fcLoaded: net && loaded != null ? loaded / net : null,
      gp: net && total != null ? net - total : null,
      gm: net && total != null ? (net - total) / net : null,
      gmLoaded: net && loaded != null ? (net - loaded) / net : null,
      perPiece: d.pieces && total != null ? total / d.pieces : null,
      lines: lines, missing: missing, mismatch: mismatch
    };
    memo[id] = r;
    return r;
  }
  Object.keys(dishes).forEach(function (id) { cost(id); });
  return memo;
}

/* Read a pack-size / unit cell from a supplier sheet into {unit, qty}: how many g, ml or pieces one list price buys.
   Understands "kg", "g", "ml", "L", "pcs", "Bot/700ml", "Box/1000ml", "Tray/24can", "Pack/12Bot.", "Tank/20L", "Can/565g",
   "1L x 12", "970ml x 3", "5kg/box", "per/800g", "30pcs/tray". Returns null when it cannot tell, so the caller can flag it. */
var OZ_BOTTLE = { "12": 350, "23": 700, "25": 750, "30": 1000, "33": 1000 };
function parsePack(text) {
  var t = normName(text).replace(/\.$/, "");
  if (!t || t === "g" || t === "gram" || t === "grams") return { unit: "g", qty: 1 };

      '<div class="field"><label for="s-batches">Batch sizes (L)</label><input id="s-batches" data-set="batchSizes" value="' + esc((s.batchSizes || [5, 10, 15]).join(", ")) + '"' + dis() + "><small>Comma-separated; 1 L scaled as 1 kg of raw ingredients</small></div>" +
      '<div class="field"><label for="s-ratio">Cooked rice from 1 g raw (g)</label><input id="s-ratio" data-set="riceRatio" inputmode="decimal" value="' + esc(s.riceRatio || 3) + '"' + dis() + "><small>Master note: rice triples when cooked, so a 60 g cooked serve costs 20 g of raw rice</small></div>" +
      '<div class="field"><label for="s-egg">Egg weight (g per piece)</label><input id="s-egg" data-set="eggG" inputmode="decimal" value="' + esc(s.eggG) + '"' + dis() + "></div></div></div>" +
      '<div class="panel"><h3>How costs are worked out</h3><p class="lede">Line cost is quantity × price. Where a recipe is written in grams and the price is per litre, the density on the Prices tab converts it; with no density on file the line is treated 1:1 and flagged. Cost per portion is batch cost \u00f7 yield \u00d7 portion size, plus anything served with it. Loaded cost adds waste and spoilage, then overhead on top. Suggested price = loaded cost \u00f7 target food cost %. Food cost % is shown after loading, against the target; the ingredient-only figure is in each dish. Sub-recipes feed dishes at their ingredient cost per gram.</p><p class="lede">New menus: send the recipe workbook to Claude in chat. It is checked for errors, then loaded here.</p><p class="lede">Beverages: bottles are priced per ml from their pack size (a 25 oz label is read as the 750 ml bottle, 23 oz as 700 ml, 12 oz as 350 ml); cans and bottled water are priced per can or bottle. The Prices tab shows the cost of a 30 ml pour beside each liquid.</p></div>';
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {

    if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }

    if (a === "open") { S.detail = t.dataset.id; S.edit = null; S.asWritten = false; render(); }
    else if (a === "rmphoto" && S.detail) removePhoto(S.detail);
    else if (a === "close") { S.detail = null; S.edit = null; render(); }

    else if (a === "addline" && S.edit) {
      var nm = normName($("al-name").value), q = parseNum($("al-qty").value), k = Object.keys(S.prices).filter(function (x) { return normName(S.prices[x].name) === nm; })[0];
      if (!k) return toast("Pick an ingredient from the price list.");
      if (!(q > 0)) return toast("Enter a quantity above zero.");

    }

      if (!(pr >= 0)) return toast("Enter the price as a number.");
      var pid = nextPid(), by = {}; by[shardFor(pid)] = {}; by[shardFor(pid)][pid] = { name: name, unit: unit, price: unit === "pc" ? pr : pr / 1000, source: "Added in app", supplier: "", pack: "", aliases: [], flag: "", check: false, prev: null, changed: today(), cat: $("np-cat").value };
      updPrices(by).then(function () { toast("Added " + name); }).catch(writeErr);
    }
    else if (a === "rmside" && d) { var ns = (d.sides || []).slice(); ns.splice(+t.dataset.i, 1); updDish(d.id, { sides: ns }); }
    else if (a === "addside" && d) {
      var an = normName($("ad-name").value), aq = parseNum($("ad-qty").value), au = $("ad-unit").value;
      if (!(aq > 0)) return toast("Enter the quantity per serve.");
      var pk = Object.keys(S.prices).filter(function (x) { return normName(S.prices[x].name) === an; })[0];
      var sk = Object.keys(S.dishes).filter(function (x) { return S.dishes[x].type === "Sub-recipe" && normName(S.dishes[x].name) === an; })[0];
      if (!pk && !sk) return toast("Pick an ingredient from the price list or a sub-recipe.");
      if (sk === d.id) return toast("A dish cannot be served with itself.");
      var side = pk ? { label: S.prices[pk].name, p: pk, q: aq, u: au } : { label: S.dishes[sk].name, sub: sk, q: aq, u: "g" };
      updDish(d.id, { sides: (d.sides || []).concat([side]) }).then(function () { toast("Added " + side.label); });
    }
    else if (a === "csv") exportCsv();
    else if (a === "wreset") { S.wiz = { step: 1 }; render(); }
    else if (a === "wback") { S.wiz.step = 2; render(); }
    else if (a === "wpaste") {
      var txt = $("w-paste").value; if (!txt.trim()) return toast("Paste the table first.");
      var rows = txt.split(/\r?\n/).map(function (r) { return r.split("\t"); });
      wizLoadRows(rows, "Pasted table " + today()); render();
    }
    else if (a === "wpreview") { wizMatch(); S.wiz.step = 3; render(); }
    else if (a === "wapply") wizApply();
  });
  document.addEventListener("input", function (e) {
    var id = e.target.id;
    if (id === "f-q") { S.f.q = e.target.value; render(); }
    else if (id === "p-q") { S.pf.q = e.target.value; render(); }
    else if (id === "w-paste") S.wiz.paste = e.target.value;
  });
  document.addEventListener("change", function (e) {
    var t = e.target, id = t.id, v;
    if (id === "f-menu") { S.f.menu = t.value; render(); }
    else if (id === "f-cuisine") { S.f.cuisine = t.value; render(); }
    else if (id === "f-type") { S.f.type = t.value; render(); }
    else if (id === "f-sort") { S.f.sort = t.value; render(); }
    else if (id === "f-attn") { S.f.attn = t.checked; render(); }
    else if (id === "p-show") { S.pf.show = t.value; render(); }

    else if (id === "cmp-by") { S.cmp = t.value; render(); }

    else if (id === "d-aswritten") { S.asWritten = t.checked; render(); }
    else if (id === "d-photo" && S.detail) { addPhoto(S.detail, t.files && t.files[0]); }
    else if (id === "d-rice" && S.detail) { var dd = S.dishes[S.detail], keep = (dd.sides || []).filter(function (x) { return x.kind !== "rice"; }), cooked = ((dd.sides || []).filter(function (x) { return x.kind === "rice"; })[0] || {}).cooked || 60; updDish(S.detail, { sides: t.value ? [{ kind: "rice", p: t.value, cooked: cooked }].concat(keep) : keep }); }
    else if (id === "d-ricecooked" && S.detail) { v = parseNum(t.value); if (!(v > 0)) return toast("Enter the cooked rice weight in grams."); var ds2 = (S.dishes[S.detail].sides || []).map(function (x) { return x.kind === "rice" ? Object.assign({}, x, { cooked: v }) : x; }); t.defaultValue = t.value; updDish(S.detail, { sides: ds2 }); }
    else if (t.dataset.dfield && S.detail) { v = parseNum(t.value); if (v !== v || v < 0) return toast("Enter a number."); if (t.dataset.dfield === "portion" && !(v > 0)) return toast("Portion size must be above zero."); var patch = {}; patch[t.dataset.dfield] = v || null; t.defaultValue = t.value; updDish(S.detail, patch); }
    else if (t.dataset.eq && S.edit) { v = parseNum(t.value); if (v === v && v != null) S.edit.lines[+t.dataset.eq].q = v; }
    else if (t.dataset.price) {
      v = parseNum(t.value); var p = S.prices[t.dataset.price]; if (v == null || v !== v || v < 0) return toast("Enter the price as a number.");
      var np = p.unit === "pc" ? v : v / 1000; if (typeof p.price === "number" && Math.abs(np - p.price) < 1e-9) return;
      var by = {}; by[shardFor(t.dataset.price)] = {}; by[shardFor(t.dataset.price)][t.dataset.price] = { price: np, prev: p.price, prevSource: p.source || "", source: "Edited in app", changed: today(), check: false };
      t.defaultValue = t.value; updPrices(by).then(function () { toast(p.name + " updated; dishes re-costed"); }).catch(writeErr);
    }
    else if (t.dataset.dens) { v = parseNum(t.value); if (v !== v || v < 0) return toast("Enter density as g per ml, for example 1.03."); var b2 = {}, k = t.dataset.dens; b2[shardFor(k)] = {}; b2[shardFor(k)][k] = { density: v || null }; t.defaultValue = t.value; updPrices(b2).catch(writeErr); }
    else if (id === "s-vatinc") saveSettings({ vatIncluded: t.value === "1" });
    else if (t.dataset.set === "batchSizes") { var bs = t.value.split(/[,\s]+/).map(Number).filter(function (x) { return x > 0; }); if (!bs.length) return toast("Enter batch sizes in litres, for example 5, 10, 15."); t.defaultValue = t.value; saveSettings({ batchSizes: bs }); }
    else if (t.dataset.set) { v = parseNum(t.value); if (!(v >= 0)) return toast("Enter a number."); var s = {}; s[t.dataset.set] = t.dataset.pct ? v / 100 : v; t.defaultValue = t.value; saveSettings(s); }
    else if (id === "w-file" && t.files && t.files[0]) readFile(t.files[0]);
    else if (id === "w-sheet") { wizReadSheet(t.value); render(); }
    else if (id === "w-hdr") { v = parseNum(t.value); if (v >= 1 && v <= S.wiz.rows.length) { S.wiz.hdr = v - 1; wizGuessCols(); render(); } }
    else if (id === "w-name") S.wiz.cName = +t.value, render();
    else if (id === "w-unit") S.wiz.cUnit = +t.value, render();
    else if (id === "w-price") S.wiz.cPrice = +t.value, render();
    else if (id === "w-basis") S.wiz.basis = t.value;
    else if (id === "w-label") S.wiz.label = t.value;
    else if (id === "w-cat") S.wiz.cat = t.value;
    else if (t.dataset.wi) { S.wiz.items[+t.dataset.wi].on = t.checked; render(); }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.detail) { S.detail = null; S.edit = null; render(); } });
  function saveSettings(patch) {
    if (!S.db) return;
    enqueue("settings/main", function () { var ref = S.db.doc("settings/main"); return ref.update(patch).catch(function (e) { if (e && e.code === "invalid_argument") return ref.set(Object.assign({}, S.settings, patch)); throw e; }); }).catch(writeErr);
  }
  function readFile(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        if (typeof XLSX === "undefined") throw new Error("reader");
        var book = XLSX.read(new Uint8Array(fr.result), { type: "array" });
        S.wiz = { step: 1, book: book, fileName: file.name };
        var pick = book.SheetNames.filter(function (n) { return /price|master|inventory/i.test(n); })[0] || book.SheetNames[0];
        wizReadSheet(pick);
      } catch (x) { S.wiz = { step: 1, err: "That file could not be read. Save it as .xlsx or .csv and try again, or paste the table instead." }; }
      render();
    };
    fr.onerror = function () { S.wiz = { step: 1, err: "That file could not be read." }; render(); };
    fr.readAsArrayBuffer(file);
  }
  function exportCsv() {
    var q = function (x) { x = x == null ? "" : String(x); return /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }, r = function (x, d) { return x == null ? "" : (+x).toFixed(d == null ? 2 : d); };
    var rows = [["ID", "Menu", "Cuisine", "Dish", "Type", "Batch size L", "Batch loaded cost", "Batch ingredient cost", "Portions per batch", "Portion g", "Loaded cost per portion", "Suggested price", "Total ingredient cost per portion", "Dish-only cost per portion", "Rice add-on", "Other add-ons", "Selling price", "Price set by", "Net selling price", "Food cost %", "Loaded food cost %", "Gross profit", "Gross margin %", "Gross margin % after loading"]];
    Object.keys(S.dishes).sort().forEach(function (id) { var d = S.dishes[id], c = S.costs[id]; rows.push([id, d.menu, d.cuisine, d.name, d.type, curBatch(), r(c.ing * bfOf(c) * (1 + c.loading)), r(c.ing * bfOf(c)), r(c.portions * bfOf(c), 1), d.portion, r(c.loaded), r(c.suggested, 0), r(c.total), r(c.perPortion), r(c.rice), r(c.addons), r(c.sell, 0), c.sellDefault ? "suggested" : "you", r(c.net), c.fc == null ? "" : r(c.fc * 100, 1), c.fcLoaded == null ? "" : r(c.fcLoaded * 100, 1), r(c.gp), c.gm == null ? "" : r(c.gm * 100, 1), c.gmLoaded == null ? "" : r(c.gmLoaded * 100, 1)]); });
    S.dl.save({ filename: "dish-costs-" + today() + ".csv", data: "﻿" + rows.map(function (x) { return x.map(q).join(","); }).join("\r\n") }).catch(function (e) { if (e && e.code !== "declined") toast("The export could not be saved here."); });
  }

  /* ---------- boot ---------- */
  function subErr() { $("banner").hidden = false; $("bannertext").textContent = "Live updates stopped. Reload the page to reconnect."; }
  function boot(db) {
    S.db = db;
    if (!db) { S.noDb = true; render(); return; }
    db.collection("prices").onSnapshot(function (snap) {
      var all = {}, sh = {};
      snap.docs.forEach(function (doc) { var items = (doc.data() || {}).items || {}; Object.keys(items).forEach(function (k) { if (items[k] && typeof items[k] === "object") { all[k] = items[k]; sh[k] = doc.id; } }); });
      S.prices = all; S.shardOf = sh; S.got.prices = true; recompute(); render();
    }, subErr);
    db.collection("dishes").onSnapshot(function (snap) {
      var all = {}; snap.docs.forEach(function (doc) { var d = doc.data(); if (d && d.name) { all[doc.id] = Object.assign({}, d, { id: doc.id }); } });
      S.dishes = all; S.got.dishes = true; recompute(); render();
    }, subErr);
    db.doc("settings/main").onSnapshot(function (snap) { if (snap.exists) { S.settings = Object.assign({}, S.settings, snap.data()); recompute(); render(); } }, subErr);
    db.collection("updates").orderBy("at", "desc").limit(25).onSnapshot(function (snap) { S.updates = snap.docs.map(function (d) { return d.data(); }); if (S.tab === "update" && S.wiz.step !== 2 && S.wiz.step !== 3) render(); }, function () {});
  }
  if (window.claude && window.claude.use) {
    window.claude.use("db").then(boot, function () { boot(null); });
    window.claude.use("user").then(function (u) {
      if (!u) return; S.user = u;
      u.can("data.write").then(function (ok) { if (ok === false) { S.canWrite = false; $("banner").hidden = false; $("bannertext").textContent = "You have view-only access. Ask the owner for “Can interact” to enter prices."; render(); } });
      u.id().then(function (id) { S.uid = id; });
    }, function () {});
    window.claude.use("downloads").then(function (d) { S.dl = d; if (S.tab === "compare") render(); }, function () {});
    window.claude.use("assets").then(function (a) { S.assets = a; if (S.detail) render(); }, function () {});
  } else boot(null);
})();
